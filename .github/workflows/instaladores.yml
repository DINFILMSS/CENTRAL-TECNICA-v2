name: Gerar instaladores

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Gerar instalador
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Guardar instalador do Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Central-Tecnica-Windows
          path: dist/*.exe
      - name: Guardar instalador do Mac
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Central-Tecnica-Mac
          path: dist/*.dmg
