<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central Técnica by Don · V47</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
:root{
  --black:#030504; --deck:#08100c; --panel:#0d1712; --raise:#132019; --line:#1f3128; --line2:#2b4337;
  --text:#e4f1e8; --soft:#a9bfb2; --mute:#6f877a;
  --phos:#2eff7e; --phos-d:#16a34a; --phos-glow:rgba(46,255,126,.18);
  --tally:#ff3046; --amber:#ffb21e; --cyan:#3ccfff; --violet:#a78bfa; --pink:#ff6fb5;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r1:4px; --r2:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--black);color:var(--text);font:400 14px/1.45 var(--body);font-stretch:100%;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
::selection{background:var(--phos);color:#000}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid var(--black)}::-webkit-scrollbar-track{background:transparent}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:64px 1fr;height:100vh}
.master{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px 0 0;background:var(--deck);border-bottom:1px solid var(--line);position:relative;z-index:5}
.master::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--phos) 0,var(--phos) 232px,transparent 232px)}
.brand{width:232px;height:100%;display:flex;align-items:center;gap:10px;padding-left:18px;border-right:1px solid var(--line)}
.brand .lamp{width:10px;height:10px;border-radius:50%;background:var(--phos);box-shadow:0 0 12px var(--phos)}
.brand b{font:800 15px/1 var(--display);font-stretch:75%;letter-spacing:.02em}
.brand small{display:block;font:500 11px/1.2 var(--body);color:var(--mute);margin-top:3px}
.projsel{display:flex;align-items:center;gap:8px}
.projsel select{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r1);padding:7px 30px 7px 10px;max-width:260px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.spacer{flex:1}
.countdown{text-align:right;line-height:1.1}
.countdown span{display:block;font-size:11px;color:var(--mute)}
.countdown b{font:600 15px var(--mono);color:var(--amber)}
.clock{font:800 30px/1 var(--mono);letter-spacing:.02em;color:var(--phos);text-shadow:0 0 18px var(--phos-glow);padding:6px 14px;border:1px solid var(--line2);border-radius:var(--r1);background:#020302;min-width:236px;text-align:center}
.clock i{font-style:normal;color:var(--phos-d)}
.onair{font:900 14px/1 var(--display);font-stretch:112%;letter-spacing:.14em;padding:12px 16px;border-radius:var(--r1);border:2px solid #4a1a20;background:#1a0709;color:#6e2b33;cursor:pointer;transition:all .15s}
.onair:hover{color:#b3434f}
body.live .onair{background:var(--tally);border-color:var(--tally);color:#fff;box-shadow:0 0 0 4px rgba(255,48,70,.18),0 0 32px rgba(255,48,70,.55)}
body.live .master::after{background:var(--tally);height:2px}
body.live .clock{color:#fff;text-shadow:0 0 18px rgba(255,48,70,.6)}
.iconbtn{background:transparent;border:1px solid var(--line2);border-radius:var(--r1);padding:8px 10px;color:var(--soft);cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12.5px}
.iconbtn:hover{border-color:var(--phos);color:var(--text)}
kbd{font:600 10.5px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--soft)}

/* rail */
.rail{background:var(--deck);border-right:1px solid var(--line);overflow:auto;padding:14px 10px 20px}
.rail h6{margin:16px 10px 6px;font:600 11px var(--body);color:var(--mute);letter-spacing:.02em}
.rail h6:first-child{margin-top:2px}
.rail button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:var(--r1);padding:8px 10px;color:var(--soft);cursor:pointer;text-align:left;position:relative}
.rail button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{background:var(--panel);color:var(--text)}
.rail button.on{background:var(--raise);color:var(--text)}
.rail button.on::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--phos);box-shadow:0 0 10px var(--phos)}
.rail .badge{margin-left:auto;font:600 11px var(--mono);color:var(--mute)}
.rail .badge.warn{color:var(--amber)}
.rail .foot{margin:22px 10px 0;font-size:11.5px;color:var(--mute);line-height:1.5}

/* main */
main{overflow:auto;position:relative}
.view{padding:26px 30px 60px;max-width:1500px}
.vhead{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.vhead h1{margin:0;font:800 34px/1 var(--display);font-stretch:72%;letter-spacing:-.005em}
.vhead p{margin:6px 0 0;color:var(--soft);max-width:72ch}
.vhead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{background:var(--raise);border:1px solid var(--line2);border-radius:var(--r1);padding:8px 13px;cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--soft)}
.btn.go{background:var(--phos);border-color:var(--phos);color:#02140a;font-weight:700}
.btn.go:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:#ff8a96;border-color:#4a1f26;background:transparent}
.btn.danger:hover{border-color:var(--tally)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.on{border-color:var(--phos);color:var(--phos)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:18px}
.panel>h3,.panel>header h3{margin:0 0 4px;font:700 16px/1.2 var(--display);font-stretch:85%}
.panel .sub{color:var(--mute);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.side{grid-template-columns:1fr 320px;align-items:start}
.side-l{grid-template-columns:300px 1fr;align-items:start}
@media(max-width:1100px){.g3,.g4{grid-template-columns:1fr 1fr}.side,.side-l{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}.rail{display:none}.brand{width:auto;border:0}.master::after{display:none}.countdown,.clock{display:none}.g2,.g3,.g4{grid-template-columns:1fr}.view{padding:18px}}

label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:12px;color:var(--soft);margin-bottom:4px}
.in,select.in,textarea.in{width:100%;background:var(--black);border:1px solid var(--line2);border-radius:var(--r1);padding:8px 10px;outline:none}
.in:focus{border-color:var(--phos)}
textarea.in{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>label.f{flex:1;min-width:110px}
input[type=range]{accent-color:var(--phos);width:100%}
input[type=checkbox]{accent-color:var(--phos);width:16px;height:16px}
.note{font-size:12px;color:var(--mute);line-height:1.5;margin:10px 0 0}
.note.warn{color:#d9a54a}
.empty{border:1px dashed var(--line2);border-radius:var(--r2);padding:28px;text-align:center;color:var(--soft)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:hover td{background:rgba(255,255,255,.015)}
.t .in{padding:5px 8px;background:transparent;border-color:transparent}
.t .in:hover{border-color:var(--line2)}.t .in:focus{border-color:var(--phos);background:var(--black)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--soft);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--phos);border-color:#1d5a37}.pill.pend{color:var(--amber);border-color:#5a4416}.pill.res{color:var(--cyan);border-color:#1b4a5a}.pill.red{color:var(--tally);border-color:#5a1b24}

/* ---------- dashboard ---------- */
.hero{position:relative;padding:28px 30px;border-radius:var(--r2);border:1px solid var(--line);background:
  radial-gradient(120% 140% at 100% 0%,rgba(46,255,126,.10),transparent 55%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),var(--panel);overflow:hidden}
.hero .eventname{font:900 clamp(40px,6.4vw,88px)/.86 var(--display);font-stretch:62%;letter-spacing:-.01em;margin:0;text-transform:uppercase;max-width:14ch;word-break:break-word}
.hero .meta{display:flex;gap:26px;flex-wrap:wrap;margin-top:18px;color:var(--soft);padding-right:min(380px,36%);align-items:flex-end}
@media (max-width:900px){.hero .meta{padding-right:0}.hero .big{position:static;text-align:left;margin-top:18px}}
.hero .meta div span{display:block;font-size:12px;color:var(--mute)}
.hero .meta div b{font-weight:600;color:var(--text)}
.hero .big{position:absolute;right:30px;bottom:26px;text-align:right}
.hero .big span{display:block;color:var(--mute);font-size:12.5px;margin-bottom:6px}
.hero .big b{font:800 clamp(28px,3.6vw,52px)/1 var(--mono);color:var(--amber);letter-spacing:-.02em}
.hero .big b.past{color:var(--mute);font-size:24px}
@media(max-width:900px){.hero .big{position:static;text-align:left;margin-top:22px}}
.meter{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c,var(--phos)) calc(var(--p)*1%),var(--line) 0);position:relative}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--panel)}
.ring b{position:relative;font:800 22px var(--mono)}
.stat{padding:16px 18px}
.stat b{display:block;font:800 30px/1 var(--mono);margin-top:8px}
.stat span{color:var(--soft);font-size:12.5px}
.stat small{display:block;color:var(--mute);font-size:12px;margin-top:6px}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.checks li:last-child{border:0}
.checks .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.checks a{color:var(--phos);cursor:pointer;margin-left:auto;font-size:12px;white-space:nowrap;text-decoration:none}

/* ---------- catalog ---------- */
.cat-list{max-height:calc(100vh - 260px);overflow:auto;margin:0 -6px;padding:0 6px}
.cat-group summary{cursor:pointer;padding:8px 6px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;list-style:none;border-radius:var(--r1)}
.cat-group summary::-webkit-details-marker{display:none}
.cat-group summary:hover{background:var(--raise)}
.cat-group summary .sw{width:8px;height:8px;border-radius:2px}
.cat-group summary em{margin-left:auto;font-style:normal;color:var(--mute);font:500 11px var(--mono)}
.cat-item{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 22px;font-size:13px;color:var(--soft);border-radius:var(--r1);cursor:pointer}
.cat-item:hover{background:var(--raise);color:var(--text)}
.cat-item .plus{margin-left:auto;color:var(--phos);font:700 14px var(--mono);opacity:0}
.cat-item:hover .plus{opacity:1}
.chip{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.ports{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.port{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12.5px}
.port input{flex:1;min-width:0}
.port .x{background:none;border:0;color:var(--mute);cursor:pointer;padding:2px 4px}
.port .x:hover{color:var(--tally)}

/* ---------- canvases (patch / floor / house) ---------- */
.stage{position:relative;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:#040806}
.stage svg{display:block;width:100%;user-select:none;-webkit-user-select:none}
.stage.patch{height:calc(100vh - 250px);min-height:460px}
.stage.patch svg{height:100%;cursor:grab}
.stage.patch svg.panning{cursor:grabbing}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sep{width:1px;height:24px;background:var(--line2);margin:0 4px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r1);overflow:hidden}
.seg button{background:transparent;border:0;border-right:1px solid var(--line2);padding:7px 11px;cursor:pointer;color:var(--soft);font-size:12.5px;display:flex;align-items:center;gap:6px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--raise);color:var(--text)}
.seg button i{width:9px;height:9px;border-radius:50%}
.hud{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;font:500 11.5px var(--mono);color:var(--mute);background:rgba(3,5,4,.85);padding:6px 10px;border-radius:var(--r1);border:1px solid var(--line);pointer-events:none}
.hud.top{bottom:auto;top:12px;color:var(--amber);border-color:#5a4416}
.node-h{cursor:move}
.node .pin{cursor:crosshair}
.node .pin:hover circle{stroke-width:3}
.cable{fill:none;stroke-width:2.4;stroke-linecap:round;cursor:pointer}
.cable.dim{opacity:.12}
.cable:hover{stroke-width:4}
.cable.sel{stroke-width:4.5;filter:drop-shadow(0 0 6px currentColor)}
.node.dim{opacity:.22}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--soft)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px}
.trace{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;margin-top:10px}
.trace .hop{padding:4px 9px;border-radius:var(--r1);background:var(--raise);border:1px solid var(--line2)}
.trace .arr{color:var(--mute);font:500 11px var(--mono)}

/* multiview */
.mv-wrap{background:#000;border:10px solid #151a17;border-bottom-width:22px;border-radius:12px;box-shadow:0 30px 60px -30px #000, inset 0 0 0 1px #222;position:relative}
.mv-wrap::after{content:"";position:absolute;bottom:-16px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--phos);box-shadow:0 0 8px var(--phos)}
.mv{display:grid;gap:3px;background:#000;aspect-ratio:16/9;padding:3px}
.mvc{position:relative;background:linear-gradient(135deg,#0d1411,#070b09);border:2px solid #2a2f2c;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;overflow:hidden;min-height:0}
.mvc:hover{border-color:#5d6b63}
.mvc .lbl{width:100%;text-align:center;background:rgba(0,0,0,.78);font:700 clamp(9px,1vw,13px)/1.6 var(--display);font-stretch:85%;letter-spacing:.04em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.mvc .src{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(14px,2.6vw,38px)/1 var(--display);font-stretch:70%;color:#2c3a33;text-transform:uppercase;text-align:center;padding:10px}
.mvc .n{position:absolute;top:5px;left:7px;font:600 11px var(--mono);color:#56655c}
.mvc.pgm{border-color:var(--tally);box-shadow:inset 0 0 0 2px var(--tally)}
.mvc.pvw{border-color:#25e05f;box-shadow:inset 0 0 0 2px #25e05f}
.mvc.pgm .lbl{background:var(--tally)}.mvc.pvw .lbl{background:#169c44}
.mvc.sel{outline:2px dashed var(--amber);outline-offset:-6px}
.mvc .safe{position:absolute;inset:7% 5%;border:1px dashed rgba(255,255,255,.06);pointer-events:none}

/* rundown */
.rd{width:100%;border-collapse:separate;border-spacing:0 6px}
.rd td{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:middle}
.rd td:first-child{border-left:1px solid var(--line);border-radius:var(--r1) 0 0 var(--r1);width:44px}
.rd td:last-child{border-right:1px solid var(--line);border-radius:0 var(--r1) var(--r1) 0;white-space:nowrap;width:1%}
.rd tr.cur td{background:#1d0b0e;border-color:#5a1b24}
.rd tr.cur td:first-child{box-shadow:inset 4px 0 0 var(--tally)}
.rd tr.done td{opacity:.45}
.sep tr.done td{opacity:.5}.doc td.c{text-align:center}
.rd .idx{font:700 13px var(--mono);color:var(--mute)}
.rd .in{background:transparent;border-color:transparent;padding:5px 6px}
.rd .in:focus{background:var(--black);border-color:var(--phos)}
.rd .tm{font:600 13px var(--mono);color:var(--soft);white-space:nowrap}
.typetag{font:700 11px var(--mono);padding:3px 7px;border-radius:3px;background:var(--raise);border:1px solid var(--line2)}
.live-card{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin-bottom:18px}
.live-card>div{padding:18px 20px;border-right:1px solid var(--line);background:var(--panel)}
.live-card>div:last-child{border:0}
.live-card span{font-size:12px;color:var(--mute);display:block}
.live-card b{display:block;font:800 26px/1.1 var(--display);font-stretch:75%;margin-top:6px}
.live-card .tc{font:800 40px/1 var(--mono);margin-top:8px}
.live-card .tc.over{color:var(--tally)}
body.live .live-card>div:first-child{background:#1a070a}
.bar{height:5px;background:var(--line);border-radius:5px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--phos)}
body.live .bar i{background:var(--tally)}
@media(max-width:900px){.live-card{grid-template-columns:1fr}.live-card>div{border-right:0;border-bottom:1px solid var(--line)}}

/* crew */
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:14px;position:relative}
.cc .who{display:flex;gap:12px;align-items:center}
.cc .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--display);background:var(--raise);border:1px solid var(--line2);flex:none}
.cc .in{background:transparent;border-color:transparent;padding:3px 5px}
.cc .in:focus,.cc .in:hover{border-color:var(--line2)}
.cc .nm{font-weight:700;font-size:15px}
.cc dl{display:grid;grid-template-columns:70px 1fr;gap:2px 8px;margin:12px 0 0;font-size:12.5px;align-items:center}
.cc dt{color:var(--mute)}.cc dd{margin:0}
.cc .del{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px}
.cc .del:hover{color:var(--tally)}
.chan{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chan .pill{font-size:12px;padding:4px 10px}

/* checklist */
.ck-group{margin-bottom:18px}
.ck-group h4{margin:0 0 8px;font:700 14px var(--display);font-stretch:85%;display:flex;gap:10px;align-items:center}
.ck-group h4 em{font:500 11.5px var(--mono);color:var(--mute);font-style:normal}
.ck{display:flex;align-items:center;gap:12px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);margin-bottom:5px;cursor:pointer}
.ck.done{border-color:#164a2c}
.ck.done span{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--phos-d)}
.ck .box{width:18px;height:18px;border:1.5px solid var(--line2);border-radius:3px;display:grid;place-items:center;flex:none}
.ck.done .box{background:var(--phos);border-color:var(--phos)}

.ck .x{margin-left:auto;background:none;border:0;color:var(--mute);cursor:pointer;opacity:0}
.ck:hover .x{opacity:1}.ck .x:hover{color:var(--tally)}

.sigwrap{position:relative;background:#000;border-radius:var(--r2);overflow:hidden;border:1px solid var(--line)}
.sigwrap canvas{display:block;width:100%;aspect-ratio:16/9}
.sigwrap:fullscreen{border-radius:0;border:0;display:grid;place-items:center}
.sigwrap:fullscreen canvas{width:100vw;height:100vh;aspect-ratio:auto;object-fit:contain}

/* calc */
.kpi{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-left:3px solid var(--phos);background:var(--raise);border-radius:0 var(--r1) var(--r1) 0}
.kpi span{color:var(--soft);font-size:12px}
.kpi b{font:800 26px/1.1 var(--mono)}
.kpi small{color:var(--mute);font-size:11.5px}
.hbar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:12.5px;margin-bottom:7px}
.hbar div{height:10px;background:var(--line);border-radius:3px;overflow:hidden}
.hbar div i{display:block;height:100%}
.hbar .num{text-align:right;color:var(--soft)}

/* palette */
.pal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;z-index:50;align-items:flex-start;justify-content:center;padding-top:12vh}
.pal-bg.open{display:flex}
.pal{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:0 30px 80px -20px #000;overflow:hidden}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li{padding:9px 12px;border-radius:var(--r1);cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13.5px}
.pal li small{margin-left:auto;color:var(--mute);font-size:11.5px}
.pal li.act{background:var(--raise)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--raise);border:1px solid var(--line2);border-left:3px solid var(--phos);padding:10px 16px;border-radius:var(--r1);opacity:0;transition:.2s;z-index:60;font-size:13px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:55;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{width:min(520px,94vw);background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);padding:22px}
.modal h3{margin:0 0 14px;font:800 22px var(--display);font-stretch:75%}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function portsFor(model,cat){
  const m=model||'';let mm;
  const ETH=(n=1,lbl='ETH')=>n===1?[P(lbl+' 1','Rede')]:seq(lbl,n,'Rede');
  if(/Switch de rede/.test(m)){const n=/48/.test(m)?48:/8 portas/.test(m)?8:24;return {ins:seq('Porta',n,'Rede'),outs:seq('SFP',n===8?2:4,'Rede')}}
  if((mm=m.match(/CleanSwitch (\d+)x(\d+)/)))return {ins:seq('IN',+mm[1]),outs:seq('OUT',+mm[2])};
  if((mm=m.match(/Videohub (\d+)x(\d+)/)))return {ins:seq('IN',+mm[1]),outs:[...seq('OUT',+mm[2]),...ETH()]};
  if(/ATEM Mini/.test(m))return {ins:seq('HDMI IN',m.includes('Extreme')?8:4,'HDMI'),outs:[P('HDMI OUT','HDMI'),P('USB-C Webcam','Rede'),...ETH()]};
  if(/Constellation 8K/.test(m))return {ins:[...seq('SDI IN',40),P('REF IN','REF')],outs:[...seq('SDI OUT',24),...ETH()]};
  if((mm=m.match(/ATEM (\d) M\/E Constellation/))){const n=+mm[1];const ins=n===1?10:n===2?20:40;const outs=n===1?6:n===2?12:24;return {ins:[...seq('SDI IN',ins),P('REF IN','REF')],outs:[...seq('SDI OUT',outs),...ETH()]}}
  if(/Television Studio/.test(m))return {ins:[...seq('SDI IN',8),P('REF IN','REF')],outs:[...seq('SDI OUT',2),P('HDMI MV','HDMI'),...ETH()]};
  if(/HyperDeck/.test(m))return {ins:[P('SDI IN'),P('HDMI IN','HDMI'),P('REF IN','REF')],outs:[P('SDI OUT'),P('HDMI OUT','HDMI'),...(/Shuttle/.test(m)?[]:ETH())]};
  if(/Camera Fiber Converter/.test(m))return {ins:[P('SDI da câmera'),P('REF IN','REF')],outs:[P('SMPTE Fibra','Fibra'),P('SDI RET p/ câmera')]};
  if(/Studio Fiber Converter/.test(m))return {ins:[P('SMPTE Fibra','Fibra'),P('SDI RET IN')],outs:[P('SDI câmera OUT'),P('SDI OUT 2'),...ETH()]};
  if(/SDI to HDMI|Teranex/.test(m))return {ins:[P('SDI IN')],outs:[P('HDMI OUT','HDMI'),P('SDI LOOP'),...(/Teranex/.test(m)?ETH():[])]};
  if(/Streaming Bridge/.test(m))return {ins:[],outs:[P('HDMI OUT','HDMI'),...ETH()]};
  if(/HDMI to SDI/.test(m))return {ins:[P('HDMI IN','HDMI')],outs:[P('SDI OUT 1'),P('SDI OUT 2')]};
  if(/Distribu.*1x8|SDI Distribution/.test(m))return {ins:[P('SDI IN')],outs:seq('SDI OUT',8)};
  if(/1x5/.test(m))return {ins:[P('SDI IN')],outs:seq('SDI OUT',5)};
  if(/HDMI 1x4/.test(m))return {ins:[P('HDMI IN','HDMI')],outs:seq('HDMI OUT',4,'HDMI')};
  if(/ TX$/.test(m))return {ins:[P('HDMI IN','HDMI'),P('SDI IN')],outs:[P('RF link','RF')]};
  if(/ RX$/.test(m))return {ins:[P('RF link','RF')],outs:[P('HDMI OUT','HDMI'),P('SDI OUT')]};
  if(/Sony FX3|Sony FX30/.test(m))return {ins:[],outs:[P('HDMI OUT','HDMI')]};
  if(/vMix|Playback|GC|grafismo|Replay|DeckLink/.test(m))return {ins:seq('SDI IN',2),outs:[...seq('SDI OUT',2),...ETH()]};
  if(/Encoder/.test(m))return {ins:[P('SDI IN'),P('HDMI IN','HDMI')],outs:[P('ETH / SRT','Rede')]};
  if(/Decoder/.test(m))return {ins:[],outs:[P('SDI OUT'),P('HDMI OUT','HDMI'),P('ETH / SRT','Rede')]};
  if(/Barco/.test(m))return {ins:seq('IN',8),outs:[...seq('OUT',4),...ETH()]};
  if(/Mesa de áudio|Stagebox/.test(m))return {ins:seq('Mic',8,'Áudio'),outs:[...seq('AUX',4,'Áudio'),P('Dante Pri','Rede'),P('Dante Sec','Rede')]};
  if(/Intercom|Tally|KVM|Rack RF/.test(m))return {ins:[],outs:/Matrix/.test(m)?ETH(2):ETH()};
  if(/Generator REF/.test(m))return {ins:[],outs:seq('REF OUT',6,'REF')};
  if(/Patch panel/.test(m))return {ins:seq('Frente',12),outs:seq('Fundo',12)};
  if(/Nobreak/.test(m))return {ins:[],outs:[]};
  if(/Panel|RCP|Controlador|Controller|CCU/.test(m))return {ins:[],outs:ETH()};
  if(/SmartView/.test(m))return {ins:[P('SDI IN 1'),P('SDI IN 2')],outs:[P('SDI LOOP'),...ETH()]};
  if(cat==='Monitoração'||/Monitor|SmartView|Video Assist|TV /.test(m))return {ins:[P('SDI IN 1'),P('SDI IN 2'),P('HDMI IN','HDMI')],outs:[P('SDI LOOP')]};
  if(cat==='PTZ Panasonic / Sony')return {ins:[P('SDI RET'),P('REF IN','REF')],outs:[P('SDI OUT 1'),P('SDI OUT 2'),P('HDMI OUT','HDMI'),P('ETH 1 (PoE)','Rede')]};
  if(/Studio Camera .*Pro|URSA Cine/.test(m))return {ins:[P('SDI RET'),P('REF IN','REF')],outs:[P('SDI OUT 1'),P('SDI OUT 2'),P('HDMI OUT','HDMI'),...ETH()]};
  if(cat==='Câmeras'||/Sony FX|URSA|Studio Camera|Pocket|PYXIS|Cinema Camera/.test(m))return {ins:[P('SDI RET'),P('REF IN','REF')],outs:[P('SDI OUT 1'),P('SDI OUT 2'),P('HDMI OUT','HDMI')]};
  return {ins:seq('IN',2),outs:seq('OUT',2)};
}

function dur(s,long){s=Math.max(0,Math.floor(s));const dd=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=s%60,z=n=>String(n).padStart(2,'0');return (long&&dd?dd+'d ':'')+(h||dd||long?z(h)+':':'')+z(m)+':'+z(ss)}
function mmss(s){s=Math.round(s);const neg=s<0;s=Math.abs(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,z=n=>String(n).padStart(2,'0');return (neg?'−':'')+(h?h+':'+z(m):z(m))+':'+z(x)}
function parseDur(v){v=String(v).trim();if(!v)return 0;const p=v.split(':').map(Number);if(p.some(isNaN))return 0;return p.reduce((a,b)=>a*60+b,0)}

function health(p){
  const issues=[];
  const noName=p.gear.filter(g=>!g.name);
  const pendW=p.gear.filter(g=>g.watts===''||g.watts==null);
  const camOut=p.gear.filter(g=>/CAM/.test(SHORT(g.model))&&!p.links.some(l=>l.a===g.id));
  const recIn=p.gear.filter(g=>SHORT(g.model)==='REC'&&!p.links.some(l=>l.b===g.id));
  const noFloor=p.gear.filter(g=>/CAM/.test(SHORT(g.model))&&!p.floor.items.some(i=>i.gearId===g.id||i.name===g.name));
  const ck=p.check.length?p.check.filter(c=>c.done).length/p.check.length:1;
  const li=linkIssues(p);if(li.length)issues.push(['red',`${li.length} ligação(ões) com problema: ${li[0].msg}${li.length>1?' …':''}`,'patch']);
  if(camOut.length)issues.push(['red',`${camOut.length} câmera(s) sem saída ligada no patch: ${camOut.map(g=>g.name).join(', ')}`,'patch']);
  if(recIn.length)issues.push(['red',`${recIn.length} gravador(es) sem sinal de entrada`,'patch']);
  if(pendW.length)issues.push(['pend',`${pendW.length} equipamento(s) sem potência informada — o kVA fica subestimado`,'power']);
  if(noFloor.length)issues.push(['pend',`${noFloor.length} câmera(s) ainda não posicionada(s) na planta`,'floor']);
  if(!(p.days||[]).length)issues.push(['pend','Período do evento não definido','dash-edit']);else if(!showDays(p).some(d=>d.onair))issues.push(['pend','Nenhum dia de evento com horário de entrada no ar','dash-edit']);
  if((p.days||[]).length&&showDays(p).length>0){const vazio=showDays(p).filter(d=>!rdList(p,d.id).length);if(vazio.length&&p.rundown.length)issues.push(['pend',`${vazio.length} dia(s) de ensaio/evento sem espelho`,'rundown'])}
  if(!p.rundown.length)issues.push(['pend','Espelho do programa vazio','rundown']);
  if(!p.crew.length)issues.push(['pend','Nenhuma pessoa na equipe','crew']);
  if(ck<1)issues.push(['pend',`Checklist técnico em ${Math.round(ck*100)}%`,'check']);
  {const st=sepStats(p);const first=(p.days||[])[0],last=(p.days||[]).slice(-1)[0];const now=Date.now();
   if(st.n&&first&&parseYMD(first.date)-now<3*864e5&&st.out<st.n)issues.push(['pend',`${st.n-st.out} item(ns) ainda não separados`,'sep']);
   if(st.n&&last&&now>parseYMD(last.date).getTime()+864e5&&st.out&&st.ret<st.out)issues.push(['pend',`${st.out-st.ret} item(ns) sem conferência de retorno`,'sep']);
   if(invHas()){const nf=sepItems(p).filter(i=>i.stock&&i.stock.need>i.stock.have).length;if(nf)issues.push(['pend',`${nf} item(ns) faltando no estoque do depósito`,'inv'])}}
  const total=8;const score=Math.round(((total-issues.filter(i=>i[0]==='red').length*1.5-issues.filter(i=>i[0]==='pend').length*.6)/total)*100);
  return {issues,score:clamp(score,0,100),ck};
}

const PW=210,PH=34,PR=19,PMAX=10;
let pv={x:0,y:0,k:.85},pPick=null,pSel=null,pType='auto',pFocus=null,pTrace=null;
function nodeH(g){const n=Math.max(visN(g,'ins'),visN(g,'outs'),1);return PH+n*PR+12+(needsMore(g)?18:0)}
function visN(g,s){return g.expanded?g[s].length:Math.min(PMAX,g[s].length)}
function needsMore(g){return g.ins.length>PMAX||g.outs.length>PMAX}
function portXY(g,side,pid){const arr=g[side];let i=arr.findIndex(p=>p.id===pid);if(i<0)return null;const n=visN(g,side);if(i>=n)i=n-1;return [g.x+(side==='outs'?PW:0),g.y+PH+i*PR+PR/2+4]}
function cablePath(a,b){const dx=Math.max(60,Math.abs(b[0]-a[0])*.5);return `M${a[0]},${a[1]} C${a[0]+dx},${a[1]} ${b[0]-dx},${b[1]} ${b[0]},${b[1]}`}
function traceFrom(p,startId){
  const seen=new Set([startId]),links=new Set(),order=[[startId]];let frontier=[startId];
  while(frontier.length){const nx=[];for(const id of frontier)for(const l of p.links)if(l.a===id&&!seen.has(l.b)){seen.add(l.b);links.add(l.id);nx.push(l.b)}else if(l.a===id)links.add(l.id);if(nx.length)order.push(nx);frontier=nx}
  return {nodes:seen,links,order};
}

function applyPV(){const w=$('#pWorld');if(w)w.setAttribute('transform',`translate(${pv.x},${pv.y}) scale(${pv.k})`)}
function fitPatch(){const p=cur();const svg=$('#pSvg');if(!svg||!p.gear.length)return;const r=svg.getBoundingClientRect();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;p.gear.forEach(g=>{x0=Math.min(x0,g.x);y0=Math.min(y0,g.y);x1=Math.max(x1,g.x+PW);y1=Math.max(y1,g.y+nodeH(g))});const k=clamp(Math.min((r.width-60)/(x1-x0),(r.height-60)/(y1-y0)),.2,1.2);pv={k,x:(r.width-(x1-x0)*k)/2-x0*k,y:(r.height-(y1-y0)*k)/2-y0*k};applyPV()}

function houseSVG(p,id,print){

function bindHouse(){
  const svg=$('#hSvg'),p=cur(),h=p.house;if(!svg)return;
  svg.onpointerdown=e=>{
    const pt=svgPt(svg,e);const gi=e.target.closest('.hi'),gb=e.target.closest('.hb');
    if(!gi&&!gb){if(hSel){hSel=null;R.house()}return}
    const isB=!gi;const obj=isB?h.benches.find(b=>b.id===gb.dataset.id):h.items.find(i=>i.id===gi.dataset.id);
    if(hSel!==obj.id){hSel=obj.id;R.house();return}
    const ox=obj.x-pt.x,oy=obj.y-pt.y;const kids=isB?h.items.filter(i=>i.bench===obj.id).map(i=>({i,dx:i.x-obj.x,dy:i.y-obj.y})):[];
    svg.setPointerCapture(e.pointerId);
    svg.onpointermove=ev=>{const q=svgPt(svg,ev);obj.x=Math.round((q.x+ox)/5)*5;obj.y=Math.round((q.y+oy)/5)*5;kids.forEach(k=>{k.i.x=obj.x+k.dx;k.i.y=obj.y+k.dy});const t=houseSVG(p);svg.innerHTML=t.slice(t.indexOf('>')+1,t.lastIndexOf('</svg>'))};
    svg.onpointerup=()=>{svg.onpointermove=null;svg.onpointerup=null;
      if(!isB){const b=h.benches.find(b=>obj.x>b.x&&obj.x<b.x+b.w*PXM&&obj.y>b.y-20&&obj.y<b.y+b.d*PXM+20);
        if(b&&obj.type!=='operator'&&obj.type!=='chair'){obj.bench=b.id;const D=(HTYPES[obj.type]||HTYPES.other)[2]*PXM;if(b.d>b.w){obj.x=b.x+b.w*PXM/2;obj.rot=90}else obj.y=b.y+D/2+12;toast(`Encaixado na ${b.name}`)}else obj.bench=null}
      save();R.house()};
  };
}

/* ---------- cabos ---------- */
const CABLE_T={'Chão / passa-cabos':{c:'#2eff7e'},'Aéreo / truss':{c:'#3ccfff'},'Fibra óptica':{c:'#ffb21e'},'Rede / CAT':{c:'#a78bfa'},'Energia':{c:'#ff3046'},'Áudio':{c:'#ff6fb5'}};
let cDraw=null,cSel=null;
function routeLen(r,scale){let px=0;for(let i=1;i<r.pts.length;i++)px+=Math.hypot(r.pts[i][0]-r.pts[i-1][0],r.pts[i][1]-r.pts[i-1][1]);return {px,m:scale?px*scale:null}}
R.cable=()=>{
  const p=cur(),c=p.cables,sc=p.floor.scale;

  <div class="vhead"><div><h1>Passagem de cabos</h1><p>Desenhe o caminho físico de cada lance sobre a planta: clique para criar pontos e dê duplo clique para encerrar. Com a escala calibrada na planta, a metragem sai automática com 10% de folga.</p></div>
  <div class="acts"><button class="btn" id="cCsv">Exportar lista CSV</button></div></div>
  <div class="toolbar"><label class="row" style="gap:6px;font-size:12.5px;color:var(--soft)">Tipo <select class="in" id="cType" style="width:auto;padding:6px 8px">${Object.keys(CABLE_T).map(k=>`<option>${k}</option>`).join('')}</select></label>
   <button class="btn ${cDraw?'on':'go'} sm" id="cNew">${cDraw?'Concluir rota':'+ Nova rota'}</button>${cDraw?'<button class="btn sm" id="cUndo">Desfazer ponto</button><button class="btn sm ghost" id="cCancel">Cancelar</button>':''}
   <span style="margin-left:auto;font-size:12px;color:var(--mute)">${sc?'Escala da planta ativa':'Planta sem escala — informe metragens à mão ou calibre em Planta e câmeras'}</span></div>
  <div class="grid side"><div class="stage" id="cStage">${cableSVG(p)}${cDraw?`<div class="hud top">Desenhando · ${cDraw.pts.length} ponto(s) · duplo clique encerra</div>`:''}</div>
  <div class="panel"><h3>Rotas</h3><p class="sub">Total previsto: <b class="num" style="color:var(--text)">${fmt(tot*1.1,1)} m</b> com folga</p>

     <div class="row" style="justify-content:space-between"><span><span class="chip" style="background:${CABLE_T[r.type]?.c}"></span><b>${esc(r.name)}</b></span><span class="num" style="color:var(--soft)">${m?fmt(m*1.1,1)+' m':'—'}</span></div>
     ${cSel===r.id?`<div style="margin-top:10px"><label class="f"><span>Identificação</span><input class="in" data-k="name" value="${esc(r.name)}"></label><label class="f"><span>Metragem informada (m) — substitui o cálculo</span><input class="in num" data-k="len" value="${esc(r.len||'')}" placeholder="${L.m?fmt(L.m,1):'sem escala'}"></label><button class="btn danger sm" data-del>Remover rota</button></div>`:''}</div>`}).join(''):'<div class="empty"><b>Nenhuma rota</b>Escolha o tipo e clique em “Nova rota”.</div>'}
  </div></div>`;
  const svg=$('#cSvg');
  $('#cNew').onclick=()=>{if(cDraw){finishRoute()}else{cDraw={pts:[],type:$('#cType').value};R.cable()}};

  $('#cCancel')&&($('#cCancel').onclick=()=>{cDraw=null;R.cable()});
  svg.onclick=e=>{if(!cDraw)return;const q=svgPt(svg,e);cDraw.pts.push([Math.round(q.x),Math.round(q.y)]);R.cable()};
  svg.ondblclick=e=>{if(cDraw){e.preventDefault();cDraw.pts.pop();finishRoute()}};
  $$('[data-r]').forEach(d=>{d.onclick=e=>{if(e.target.closest('input,button'))return;cSel=cSel===d.dataset.r?null:d.dataset.r;R.cable()};const r=c.routes.find(x=>x.id===d.dataset.r);d.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{r[i.dataset.k]=i.value.replace(',','.');save();R.cable()});const del=d.querySelector('[data-del]');if(del)del.onclick=()=>{c.routes=c.routes.filter(x=>x!==r);cSel=null;save();R.cable()}});
  $('#cCsv').onclick=()=>download(`cabos-${slug(p.name)}.csv`,csv([['Rota','Tipo','Metragem (m)','Com folga 10% (m)'],...c.routes.map(r=>{const m=r.len?+r.len:routeLen(r,sc).m;return [r.name,r.type,m?fmt(m,1):'',m?fmt(m*1.1,1):'']})]),'text/csv');

function finishRoute(){const p=cur();if(cDraw&&cDraw.pts.length>1){const r={id:uid(),name:`${cDraw.type.split(' ')[0]} ${p.cables.routes.length+1}`,type:cDraw.type,pts:cDraw.pts,len:''};p.cables.routes.push(r);cSel=r.id;save()}cDraw=null;R.cable()}
function cableSVG(p){

/* ---------- energia ---------- */
function powerCalc(p){
  const c=p.power;const W=p.gear.reduce((a,g)=>a+(+g.watts||0),0);const Wr=W*(1+(+c.res||0)/100);const VA=Wr/(+c.fp||1);
  const I=c.phase==='tri'?VA/(Math.sqrt(3)*c.v):VA/c.v;
  return {W,Wr,VA,kva:VA/1000,I,pend:p.gear.filter(g=>g.watts===''||g.watts==null).length,fab:p.gear.filter(g=>g.wsrc==='fab').length,aprox:p.gear.filter(g=>g.wsrc==='aprox').length,man:p.gear.filter(g=>g.wsrc==='manual').length};
}

   <div class="kpi" style="border-color:var(--amber)"><span>Potência aparente</span><b>${fmt(r.kva,2)} kVA</b><small>${fmt(r.VA,0)} VA</small></div>
   <div class="kpi" style="border-color:var(--tally)"><span>Corrente ${c.phase==='tri'?'por fase':''}</span><b>${fmt(r.I,1)} A</b><small>${c.phase==='tri'?'trifásico equilibrado':'monofásico'} · ${c.v} V</small></div>
  </div>
  <div class="grid side" style="margin-top:16px">
   <div class="panel" style="padding:6px"><table class="t"><thead><tr><th>Equipamento</th><th>Potência máx. (W)</th><th>Origem do valor</th></tr></thead><tbody>
   ${p.gear.map(g=>{const ref=powerOf(g.model,g.cat);const [lab,cls]=WSRC[g.wsrc]||['Sem valor','red'];return `<tr data-id="${g.id}"><td>${esc(g.name)} <span style="color:var(--mute);font-size:12px">${esc(g.model)}</span></td><td><input class="in num" data-w value="${esc(g.watts)}" placeholder="—" style="width:90px"></td><td><span class="pill ${cls}" title="${esc(g.wsrc==='manual'?'Tabela: '+ref.w+' W ('+(ref.src==='fab'?'fabricante':'aproximado')+')':ref.note)}"><i></i>${lab}</span>${g.wsrc!=='manual'&&ref.note?` <span style="color:var(--mute);font-size:11.5px">${esc(ref.note)}</span>`:''}</td></tr>`}).join('')}
   </tbody></table></div>
   <div class="grid">
    <div class="panel"><h3>Parâmetros</h3>
     <div class="row" style="margin-top:10px"><label class="f"><span>Tensão</span><select class="in" data-c="v">${[127,220,380].map(v=>`<option value="${v}" ${+c.v===v?'selected':''}>${v} V</option>`).join('')}</select></label><label class="f"><span>Sistema</span><select class="in" data-c="phase"><option value="mono" ${c.phase==='mono'?'selected':''}>Monofásico</option><option value="tri" ${c.phase==='tri'?'selected':''}>Trifásico</option></select></label></div>

  $$('[data-w]').forEach(i=>i.onchange=()=>{const g=gearById(i.closest('tr').dataset.id);const v=i.value.replace(',','.').trim();if(v===''){const ref=powerOf(g.model,g.cat);g.watts=String(ref.w);g.wsrc=ref.src}else{g.watts=v;g.wsrc='manual'}save();R.power();renderRail()});

R.rec=()=>{

  <div class="grid g4">
   <div class="kpi"><span>Espaço necessário</span><b>${GB>=1000?fmt(GB/1000,2)+' TB':fmt(GB,0)+' GB'}</b><small>com ${r.margin}% de margem</small></div>
   <div class="kpi" style="border-color:var(--cyan)"><span>Horas por mídia, por fonte</span><b>${mmss(hPerMedia*3600)}</b><small>mídia de ${r.media} GB · 7% de formatação</small></div>
   <div class="kpi" style="border-color:var(--amber)"><span>Mídias por fonte</span><b>${Math.ceil(r.h/hPerMedia)}</b><small>para ${r.h} h de evento</small></div>
   <div class="kpi" style="border-color:${totalUseful>=GB?'var(--phos)':'var(--tally)'}"><span>Saldo com ${r.mediaQty} mídia(s)</span><b>${fmt((totalUseful-GB)/1000,2)} TB</b><small>${totalUseful>=GB?'Cabe tudo':'Faltam mídias'}</small></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
   <div class="panel"><h3>Fontes gravadas</h3>
    <label class="f" style="margin-top:12px"><span>Referência de codec</span><select class="in" id="rCodec"><option value="">Personalizado</option>${CODECS.map(([n,b])=>`<option value="${b}" ${+r.br===b?'selected':''}>${n} · ~${b} Mb/s</option>`).join('')}</select></label>
    <div class="row"><label class="f"><span>Bitrate (Mb/s)</span><input class="in num" type="number" data-r="br" value="${r.br}"></label><label class="f"><span>Fontes simultâneas</span><input class="in num" type="number" min="1" data-r="src" value="${r.src}"></label></div>
    <div class="row"><label class="f"><span>Duração (h)</span><input class="in num" type="number" step=".25" data-r="h" value="${r.h}"></label><label class="f"><span>Margem (%)</span><input class="in num" type="number" data-r="margin" value="${r.margin}"></label></div>
    <p class="note">Gravadores no projeto: ${p.gear.filter(g=>SHORT(g.model)==='REC').map(g=>esc(g.name)).join(', ')||'nenhum'}.</p></div>
   <div class="panel"><h3>Mídias disponíveis</h3>
    <div class="row" style="margin-top:12px"><label class="f"><span>Capacidade por mídia</span><select class="in" data-r="media">${[64,128,256,512,1000,2000,4000,8000].map(v=>`<option value="${v}" ${+r.media===v?'selected':''}>${v>=1000?v/1000+' TB':v+' GB'}</option>`).join('')}</select></label><label class="f"><span>Quantidade</span><input class="in num" type="number" min="1" data-r="mediaQty" value="${r.mediaQty}"></label></div>
    <p class="note">Cada fonte simultânea precisa do seu próprio gravador ou canal ISO. O saldo considera todas as mídias juntas.</p></div>
  </div>`;
  $$('[data-r]').forEach(i=>i.onchange=()=>{r[i.dataset.r]=+i.value||0;save();R.rec()});
  $('#rCodec').onchange=e=>{if(e.target.value){r.br=+e.target.value;save();R.rec()}};
};

  $$('.cc').forEach(el=>{const c=p.crew.find(x=>x.id===el.dataset.id);el.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{c[i.dataset.k]=i.value;save();if(i.dataset.k!=='radio'&&i.dataset.k!=='phone')R.crew()});el.querySelector('.del').onclick=()=>{p.crew=p.crew.filter(x=>x!==c);save();renderRail();R.crew()}});

/* ---------- checklist ---------- */
R.check=()=>{
  const p=cur();const groups=[...new Set(p.check.map(c=>c.group))];const done=p.check.filter(c=>c.done).length;
  $('#view').innerHTML=`
  <div class="vhead"><div><h1>Checklist técnico</h1><p>Conferências antes de entrar no ar. O progresso aparece no painel do evento.</p></div>
  <div class="acts"><button class="btn ghost" id="ckReset">Desmarcar tudo</button></div></div>
  <div class="grid side"><div>${groups.map(g=>{const it=p.check.filter(c=>c.group===g);return `<div class="ck-group"><h4>${esc(g)}<em>${it.filter(c=>c.done).length}/${it.length}</em></h4>${it.map(c=>`<div class="ck ${c.done?'done':''}" data-id="${c.id}" role="checkbox" aria-checked="${c.done}" tabindex="0"><span class="box"></span><span>${esc(c.text)}</span><button class="x" title="Remover item">✕</button></div>`).join('')}</div>`}).join('')}</div>
  <div class="grid"><div class="panel meter"><div class="ring" style="--p:${p.check.length?done/p.check.length*100:0}"><b>${p.check.length?Math.round(done/p.check.length*100):0}%</b></div><div><b style="font-size:15px">${done} de ${p.check.length}</b><p class="note" style="margin-top:4px">itens conferidos</p></div></div>
   <div class="panel"><h3>Novo item</h3><label class="f" style="margin-top:10px"><span>Grupo</span><input class="in" id="ckG" list="ckGl" value="${esc(groups[0]||'Geral')}"><datalist id="ckGl">${groups.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></label><label class="f"><span>Item</span><input class="in" id="ckT" placeholder="Ex.: Tally conferido nas câmeras"></label><button class="btn go" id="ckAdd">Adicionar</button></div></div></div>`;
  $$('.ck').forEach(el=>{const c=p.check.find(x=>x.id===el.dataset.id);const t=()=>{c.done=!c.done;save();renderRail();R.check()};el.onclick=e=>{if(e.target.closest('.x')){p.check=p.check.filter(x=>x!==c);save();renderRail();R.check();return}t()};el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();t()}}});
  $('#ckAdd').onclick=()=>{const t=$('#ckT').value.trim();if(!t)return;p.check.push({id:uid(),group:$('#ckG').value.trim()||'Geral',text:t,done:false});save();renderRail();R.check()};
  $('#ckReset').onclick=()=>{p.check.forEach(c=>c.done=false);save();renderRail();R.check()};
};

/* ---------- sinal de teste ---------- */
const sig={raf:0,ac:null,osc:null,gain:null,fps:30,every:1,run:false,t0:0,tone:false,mode:'bars',label:''};
function stopSignal(){sig.run=false;cancelAnimationFrame(sig.raf);if(sig.osc){try{sig.osc.stop()}catch(e){}sig.osc=null}}
R.bars=()=>{
  if(!sig.label)sig.label=cur().name.toUpperCase();
  $('#view').innerHTML=`
  <div class="vhead"><div><h1>Sinal de teste</h1><p>Barras de cor com identificação, contador de quadros e flash + bipe de sincronismo. Abra em tela cheia numa saída do computador para conferir cadeia de vídeo e atraso de áudio.</p></div>
  <div class="acts"><button class="btn" id="sFull">Tela cheia</button><button class="btn ${sig.run?'on':'go'}" id="sRun">${sig.run?'■ Parar':'▶ Iniciar'}</button></div></div>
  <div class="grid side"><div class="sigwrap" id="sWrap"><canvas id="sCv" width="1920" height="1080"></canvas></div>
  <div class="panel">
   <label class="f"><span>Padrão</span><div class="seg" id="sMode"><button data-m="bars" class="${sig.mode==='bars'?'on':''}">Barras 75%</button><button data-m="sync" class="${sig.mode==='sync'?'on':''}">Sync / flash</button></div></label>
   <label class="f"><span>Identificação na tela</span><input class="in" id="sLbl" value="${esc(sig.label)}"></label>
   <div class="row"><label class="f"><span>Quadros por segundo</span><select class="in" id="sFps">${[24,25,30,50,60].map(v=>`<option ${sig.fps===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="f"><span>Flash a cada</span><select class="in" id="sEv">${[1,2,5].map(v=>`<option value="${v}" ${sig.every===v?'selected':''}>${v} s</option>`).join('')}</select></label></div>
   <label class="row" style="gap:8px;margin:4px 0 12px;font-size:13px"><input type="checkbox" id="sTone" ${sig.tone?'checked':''}> Bipe de 1 kHz no flash (aprox. −18 dBFS)</label>
   <p class="note">O tempo no navegador depende do sistema e da taxa do monitor. Para medir atraso com precisão, use equipamento calibrado.</p></div></div>`;
  const cv=$('#sCv'),ctx=cv.getContext('2d');
  const draw=()=>{
    const W=1920,H=1080;const t=sig.run?(performance.now()-sig.t0)/1000:0;const fr=Math.floor(t*sig.fps);const fl=sig.run&&(t%sig.every)<(1/sig.fps)*2;
    if(sig.mode==='bars'){
      const cols=['#bfbfbf','#bfbf00','#00bfbf','#00bf00','#bf00bf','#bf0000','#0000bf'];const bw=W/7;
      cols.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(i*bw,0,bw+1,H*.67)});
      const rev=['#0000bf','#131313','#bf00bf','#131313','#00bfbf','#131313','#bfbfbf'];rev.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(i*bw,H*.67,bw+1,H*.08)});
      const low=[['#00214c',1.25],['#ffffff',1.25],['#32006a',1.25],['#131313',1.25+1/3*0],['#090909',bw/3/bw*1],['#131313',1/3],['#1d1d1d',1/3],['#131313',1]];
      let x=0;const unit=bw;[['#00214c',1.25],['#ffffff',1.25],['#32006a',1.25],['#131313',1.25],['#090909',1/3],['#131313',1/3],['#1d1d1d',1/3],['#131313',1]].forEach(([c,w])=>{ctx.fillStyle=c;ctx.fillRect(x,H*.75,unit*w+1,H*.25);x+=unit*w});
    }else{ctx.fillStyle=fl?'#ffffff':'#000';ctx.fillRect(0,0,W,H);ctx.strokeStyle=fl?'#000':'#1f3128';ctx.lineWidth=4;for(let i=0;i<sig.fps;i++){const a=i/sig.fps*Math.PI*2-Math.PI/2;ctx.beginPath();ctx.arc(W/2+Math.cos(a)*360,H/2+Math.sin(a)*360,22,0,7);ctx.fillStyle=(fr%sig.fps)===i?'#2eff7e':fl?'#ddd':'#0d1712';ctx.fill()}}
    // caixa central
    ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(W/2-440,H/2-140,880,300);ctx.strokeStyle=fl?'#ff3046':'#2eff7e';ctx.lineWidth=fl?12:3;ctx.strokeRect(W/2-440,H/2-140,880,300);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 64px Archivo, Arial Narrow, sans-serif';ctx.fillText(sig.label.slice(0,28),W/2,H/2-30);
    const z=n=>String(n).padStart(2,'0');const s=Math.floor(t);ctx.font='800 76px JetBrains Mono, monospace';ctx.fillStyle=fl?'#ff3046':'#2eff7e';ctx.fillText(`${z(Math.floor(s/3600))}:${z(Math.floor(s/60)%60)}:${z(s%60)}:${z(fr%sig.fps)}`,W/2,H/2+70);
    ctx.font='600 26px JetBrains Mono, monospace';ctx.fillStyle='#888';ctx.fillText(`${sig.fps} fps · flash a cada ${sig.every} s`,W/2,H/2+130);
    if(sig.run){if(sig.tone&&fl&&!sig._beeped){beep();sig._beeped=true}if(!fl)sig._beeped=false;sig.raf=requestAnimationFrame(draw)}
  };
  draw();
  $('#sRun').onclick=()=>{if(sig.run){stopSignal();R.bars()}else{sig.run=true;sig.t0=performance.now();R.bars()}};
  if(sig.run){cancelAnimationFrame(sig.raf);sig.raf=requestAnimationFrame(draw)}
  $('#sFull').onclick=()=>{const w=$('#sWrap');(w.requestFullscreen||w.webkitRequestFullscreen).call(w)};
  $$('#sMode button').forEach(b=>b.onclick=()=>{sig.mode=b.dataset.m;R.bars()});
  $('#sLbl').oninput=e=>{sig.label=e.target.value;if(!sig.run)draw()};
  $('#sFps').onchange=e=>{sig.fps=+e.target.value;R.bars()};
  $('#sEv').onchange=e=>{sig.every=+e.target.value;R.bars()};
  $('#sTone').onchange=e=>{sig.tone=e.target.checked};
};
function beep(){try{sig.ac=sig.ac||new (window.AudioContext||window.webkitAudioContext)();const o=sig.ac.createOscillator(),g=sig.ac.createGain();o.frequency.value=1000;g.gain.value=0.126;o.connect(g).connect(sig.ac.destination);o.start();o.stop(sig.ac.currentTime+1/sig.fps*2)}catch(e){}}

/* ---------- relatório (caderno técnico) ---------- */

function importData(d){
  const list=Array.isArray(d.projects)?d.projects:Array.isArray(d)?d:null;if(!list)throw new Error('formato');
  let n=0;
  list.forEach(src=>{
    let p;
    if(src&&src.links&&src.floor&&src.floor.items){p=JSON.parse(JSON.stringify(src));p.id=uid()}
    else{ // V37/V38
      p=newProject(src.name||'Projeto importado');p.client=src.client||'';
      const map={};
      (src.gear||[]).forEach(g=>{const ng=addGearTo(p,g.name||g.model||'Equipamento',g.opName||g.alias||g.nick||undefined);map[g.id]=ng;if(g.watts||g.power)ng.watts=g.watts||g.power});
      const findPort=(g,side,name)=>{let pt=g[side].find(x=>x.name.toLowerCase()===String(name||'').toLowerCase());if(!pt){pt=P(name||(side==='ins'?'IN':'OUT'));g[side].push(pt)}return pt};
      (src.patch||[]).forEach(l=>{const a=map[l.from],b=map[l.to];if(!a||!b)return;const ap=findPort(a,'outs',l.out),bp=findPort(b,'ins',l.input);if(p.links.some(x=>x.bp===bp.id))return;const t=SIGS.find(s=>String(l.kind||'').toUpperCase().includes(s.toUpperCase()))||'SDI';p.links.push({id:uid(),a:a.id,ap:ap.id,b:b.id,bp:bp.id,type:t,label:''})});
      autoLayout(p);
      p.floor.img=src.floorImage||'';
      (src.floor||[]).forEach(it=>{const x=(+it.x||50)/100*FW,y=(+it.y||50)/100*FH;if(it.kind==='cam')p.floor.items.push({id:uid(),kind:'cam',name:it.name||'CAM',x,y,angle:(+it.angle||0),focal:+it.focal||20,sensor:+it.sensor||9.6,reach:clamp((+it.reach||30)*8,60,900)});else p.floor.items.push({id:uid(),kind:'person',name:it.name||'Pessoa',x,y,angle:0})});
      (src.house||[]).forEach(it=>{const nm=String(it.name||'');const t=/operador/i.test(nm)?'operator':/monitor|tv/i.test(nm)?'monitor':/switcher|painel|atem/i.test(nm)?'panel':/rack|videohub|hyperdeck/i.test(nm)?'rack':/notebook|vmix|computador/i.test(nm)?'laptop':'other';p.house.items.push({id:uid(),type:t,label:nm||'Elemento',x:(+it.x||50)/100*HW,y:(+it.y||50)/100*HH,rot:+it.rot||0})});
    }
    normalize(p);S.projects.push(p);n++;S.current=p.id;
  });
  save();return n;
}

function normalize(p){
  p.audio=p.audio||{ch:[],mx:{ins:'Mic 1,Mic 2,Mic 3,Mic 4,Playback L,Playback R,PGM L,PGM R',outs:'PA L,PA R,Retorno,Stream L,Stream R,Rec L,Rec R,Intercom',x:{}}};
  p.snaps=p.snaps||[];p.extras=p.extras||[];p.cases=p.cases||[];p.camsheets=p.camsheets||{};p.vh=p.vh||{};p.atem=p.atem||{gear:'',xml:'',product:'',names:{}};p.comp=p.comp||{gear:'',cols:8,startRow:0,startCol:1,tplIn:1};
  p.links.forEach(l=>{if(l.len==null)l.len=''});
  migrate45(p);
  p.gear.forEach(g=>{if(g.wsrc)return;const ref=powerOf(g.model,g.cat);if(g.watts===''||g.watts==null){g.watts=String(ref.w);g.wsrc=ref.src}else g.wsrc=(+g.watts===ref.w)?ref.src:'manual'});
  return p;
}

   V45 — evento em período, espelho por dia e racks

const DAYT=['Montagem','Ensaio','Evento','Desmontagem','Folga'];
const DAYC={Montagem:'var(--cyan)',Ensaio:'var(--amber)',Evento:'var(--tally)',Desmontagem:'var(--violet)',Folga:'#6f877a'};
function ymd(d){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
function parseYMD(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
function dayStart(d){const t=parseYMD(d.date);if(d.onair){const [h,mi]=d.onair.split(':').map(Number);t.setHours(h||0,mi||0,0,0)}return t}
function showDays(p){return (p.days||[]).filter(d=>d.type==='Evento'||d.type==='Ensaio')}
function defaultDayId(p){const ev=(p.days||[]).find(d=>d.type==='Evento')||showDays(p)[0]||(p.days||[])[0];return ev?ev.id:null}
function nextOnAir(p){const now=Date.now();const list=showDays(p).filter(d=>d.onair).map(d=>({d,t:dayStart(d)})).sort((a,b)=>a.t-b.t);return list.find(x=>x.t>now)||null}
function syncDate(p){p.days=(p.days||[]).sort((a,b)=>a.date.localeCompare(b.date));const n=nextOnAir(p);const ev=n?n.d:(p.days.find(d=>d.type==='Evento'&&d.onair)||showDays(p)[0]);p.date=ev?toLocalInput(dayStart(ev)):''}
function periodLabel(p){const ds=p.days||[];if(!ds.length)return '—';const a=parseYMD(ds[0].date),b=parseYMD(ds[ds.length-1].date);const f=o=>o.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});return ds.length===1?a.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}):`${f(a)} a ${f(b)} · ${ds.length} dias`}
function dayName(d){return parseYMD(d.date).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})}
function rdDayOf(p){if(!live.day||!(p.days||[]).some(d=>d.id===live.day))live.day=defaultDayId(p);return live.day}
function rdList(p,dayId){if(!(p.days||[]).length)return p.rundown;const d=dayId||rdDayOf(p),def=defaultDayId(p);return p.rundown.filter(b=>(b.day||def)===d)}
function rdTimes(p){const T={};const ds=(p.days||[]).length?showDays(p):[null];if(!(p.days||[]).length){let a=0;const st=p.date?new Date(p.date):null;p.rundown.forEach((b,i)=>{T[b.id]={i,s:a,t:st?new Date(st.getTime()+a*1000):null,day:null};a+=+b.dur||0});return T}
  (p.days||[]).forEach(d=>{let a=0;const st=rdStart(p,d.id);rdList(p,d.id).forEach((b,i)=>{T[b.id]={i,s:a,t:st?new Date(st.getTime()+a*1000):null,day:d};a+=+b.dur||0})});return T}
function rdStart(p,dayId){const d=(p.days||[]).find(x=>x.id===(dayId||rdDayOf(p)));return d&&d.onair?dayStart(d):(p.date?new Date(p.date):null)}

R.rundown=()=>{

  const start=rdStart(p,dayId);let acc=0;const total=rd.reduce((a,b)=>a+(+b.dur||0),0);const sd=showDays(p);const others=sd.filter(d=>d.id!==dayId&&rdList(p,d.id).length);
  $('#view').innerHTML=`

function migrate45(p){
  p.racks=p.racks||[];
  if(!p.days){p.days=[];if(p.date){const t=new Date(p.date);if(!isNaN(t)){const z=n=>String(n).padStart(2,'0');p.days=[{id:uid(),date:ymd(t),type:'Evento',onair:`${z(t.getHours())}:${z(t.getMinutes())}`,label:''}]}}}
  const def=defaultDayId(p);(p.rundown||[]).forEach(b=>{if(!b.day||!p.days.some(d=>d.id===b.day))b.day=def});
  if(p.v45)return;p.v45=1;
  const linked=pt=>p.links.some(l=>l.ap===pt.id||l.bp===pt.id);
  p.gear.forEach(g=>{const tpl=portsFor(g.model,g.cat);
    if(/^(RF link)$/.test((g.outs[0]||{}).name)&&/ TX$/.test(g.model))g.outs[0].type='RF';
    if(/ RX$/.test(g.model)&&g.ins[0]&&g.ins[0].name==='RF link')g.ins[0].type='RF';
    if(/Switch de rede/.test(g.model)){const ti=tpl.ins.length,to=tpl.outs.length;g.ins.forEach((pt,i)=>{if(pt.name==='Rede')pt.name='Porta '+(i+1)});g.outs.forEach((pt,i)=>{if(pt.name==='Rede')pt.name='SFP '+(i+1)});
      for(let i=g.ins.length;i<ti;i++)g.ins.push(P('Porta '+(i+1),'Rede'));for(let i=g.outs.length;i<to;i++)g.outs.push(P('SFP '+(i+1),'Rede'));return}
    const oldNet=/^(Rede|Rede \/ controle|Ethernet|Rede \/ SRT|Dante)$/;
    g.ins=g.ins.filter(pt=>!(pt.type==='Rede'&&oldNet.test(pt.name)&&!linked(pt)));
    g.outs=g.outs.filter(pt=>!(pt.type==='Rede'&&oldNet.test(pt.name)&&!linked(pt)));
    tpl.outs.filter(t=>t.type==='Rede').forEach(t=>{if(!g.outs.some(x=>x.name===t.name)&&!g.outs.some(x=>x.type==='Rede'&&oldNet.test(x.name)&&(x.name=t.name)))g.outs.push(t)});
  });
  p.links.forEach(l=>{const a=p.gear.find(g=>g.id===l.a);const ap=a&&a.outs.find(x=>x.id===l.ap);if(ap&&ap.type==='RF')l.type='RF'});
}

/* ---------- fontes ligadas num switcher / matriz ---------- */
function sourcesInto(p,g){return g.ins.map((pt,i)=>{const l=p.links.find(x=>x.b===g.id&&x.bp===pt.id);const s=l&&gearById(l.a);return {n:i+1,port:pt,src:s,name:s?s.name:''}})}
function destsFrom(p,g){return g.outs.map((pt,i)=>{const ls=p.links.filter(x=>x.a===g.id&&x.ap===pt.id);const d=ls.map(l=>gearById(l.b)).filter(Boolean);return {n:i+1,port:pt,name:d.map(x=>x.name).join(' + ')}})}
const switchers=p=>p.gear.filter(g=>g.cat==='ATEM / Switchers');

/* ---------- Companion ---------- */
let compTpl=null,compSel=new Set();
async function readCompanion(file){
  const buf=await file.arrayBuffer();const u=new Uint8Array(buf);
  let txt;if(u[0]===0x1f&&u[1]===0x8b){if(!window.DecompressionStream)throw new Error('gzip');txt=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}else txt=new TextDecoder().decode(u);
  if(/^\s*[{[]/.test(txt))return JSON.parse(txt);throw new Error('formato');
}
function findControls(o,path=[]){if(!o||typeof o!=='object')return null;if(o.controls&&typeof o.controls==='object'&&!Array.isArray(o.controls))return {holder:o,path};for(const k of Object.keys(o)){const r=findControls(o[k],[...path,k]);if(r)return r}return null}
function listControls(json){const f=findControls(json);if(!f)return [];const out=[];Object.entries(f.holder.controls).forEach(([r,row])=>{if(row&&typeof row==='object')Object.entries(row).forEach(([c,ctl])=>{if(ctl&&typeof ctl==='object')out.push({r:+r,c:+c,ctl,text:String(ctl.style?.text??ctl.text??'').trim()})})});return out}
function rid(){return (crypto.randomUUID?crypto.randomUUID():uid()+uid()).replace(/-/g,'').slice(0,21)}
function retarget(o,tplIn,newIn){
  if(Array.isArray(o)){o.forEach(x=>retarget(x,tplIn,newIn));return}
  if(!o||typeof o!=='object')return;
  if(typeof o.id==='string'&&o.options&&typeof o.options==='object')o.id=rid();
  if(o.options&&typeof o.options==='object')for(const k of Object.keys(o.options)){if(/input|source|src|camera|^cam/i.test(k)){const v=o.options[k];if(v===tplIn)o.options[k]=newIn;else if(String(v)===String(tplIn))o.options[k]=typeof v==='string'?String(newIn):newIn}}
  for(const k of Object.keys(o))if(k!=='options')retarget(o[k],tplIn,newIn);else retarget(o.options,tplIn,newIn);
}
const hexToInt=h=>parseInt(String(h).replace('#',''),16);
R.comp=()=>{
  const p=cur(),c=p.comp,sws=switchers(p);if(!c.gear&&sws[0])c.gear=sws[0].id;const sw=gearById(c.gear);
  const src=sw?sourcesInto(p,sw).filter(s=>s.src):[];
  const ctrls=compTpl?listControls(compTpl.json):[];
  $('#view').innerHTML=`<div class="vhead"><div><h1>Companion</h1><p>Gera uma página de botões do Companion a partir do patch: um botão por fonte ligada no switcher, com o nome do projeto e o número certo da entrada.</p></div>
  <div class="acts"><button class="btn" id="cpCsv">Plano de botões CSV</button></div></div>
  <div class="grid g2">
   <div class="panel"><h3>1 · Fontes do switcher</h3><p class="sub">Vêm das ligações nas entradas do switcher escolhido.</p>
    <label class="f"><span>Switcher</span><select class="in" id="cpSw">${sws.map(g=>`<option value="${g.id}" ${g.id===c.gear?'selected':''}>${esc(g.name)} · ${esc(g.model)}</option>`).join('')||'<option>Nenhum switcher no projeto</option>'}</select></label>
    ${src.length?`<table class="t"><thead><tr><th>Entrada</th><th>Fonte</th><th>Cor do botão</th></tr></thead><tbody>${src.map(s=>`<tr><td class="num">${s.n}</td><td>${esc(s.name)}</td><td><span class="chip" style="background:${CAT_COLOR[s.src.cat]}"></span><span style="color:var(--mute);font-size:12px">${esc(s.src.cat)}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty"><b>Nenhuma fonte ligada</b>Ligue câmeras e outras fontes nas entradas do switcher no Patch de sinais.</div>'}
   </div>
   <div class="panel"><h3>2 · Molde do seu Companion</h3><p class="sub">No Companion, monte <b>um</b> botão do jeito que você usa (ex.: “CAM 1” cortando a entrada 1 no programa, com feedback de tally) e exporte só essa página em formato JSON. O gerador copia esse botão para cada fonte, trocando nome e número da entrada.</p>
    <button class="btn" id="cpLoad">${compTpl?'Trocar arquivo':'Carregar página exportada (.companionconfig)'}</button>
    ${compTpl?`<p class="note">Arquivo: <b>${esc(compTpl.name)}</b>${compTpl.json.version?' · formato versão '+esc(compTpl.json.version):''} · ${ctrls.length} botão(ões) encontrado(s).</p>
     ${ctrls.length?`<p style="font-size:12.5px;color:var(--soft);margin:12px 0 6px">Marque o(s) botão(ões) molde — cada um vira uma fileira (ex.: PGM e PVW):</p>${ctrls.map((x,i)=>`<label class="row" style="gap:8px;font-size:13px;padding:4px 0"><input type="checkbox" data-tp="${i}" ${compSel.has(i)?'checked':''}> <span class="num" style="color:var(--mute)">L${x.r} C${x.c}</span> ${esc(x.text||'(sem texto)')}</label>`).join('')}`:'<p class="note warn">Não encontrei botões nesse arquivo. Exporte uma página (não a configuração completa) em JSON.</p>'}
     <div class="row" style="margin-top:12px"><label class="f"><span>Entrada usada no molde</span><input class="in num" type="number" min="0" id="cpTplIn" value="${c.tplIn}"></label><label class="f"><span>Colunas</span><input class="in num" type="number" min="1" id="cpCols" value="${c.cols}"></label><label class="f"><span>Começa na linha</span><input class="in num" type="number" min="0" id="cpRow" value="${c.startRow}"></label><label class="f"><span>e coluna</span><input class="in num" type="number" min="0" id="cpCol" value="${c.startCol}"></label></div>
     <label class="row" style="gap:8px;font-size:13px;margin-bottom:12px"><input type="checkbox" id="cpColor" checked> Pintar o fundo do botão com a cor da categoria</label>
     <button class="btn go" id="cpGen" ${src.length&&compSel.size?'':'disabled'}>Gerar página do Companion</button>
     <p class="note">Confira a página importada antes do evento: o gerador troca valores de opções com nome de entrada/fonte iguais ao número do molde, e não sabe as regras de cada módulo.</p>`:''}
   </div></div>`;
  $('#cpSw')&&($('#cpSw').onchange=e=>{c.gear=e.target.value;save();R.comp()});
  $('#cpLoad').onclick=()=>{const f=$('#fileIn');f.accept='.companionconfig,.json';f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;try{compTpl={name:file.name,json:await readCompanion(file)};compSel=new Set();const cs=listControls(compTpl.json);const k=cs.findIndex(x=>x.text);if(k>=0)compSel.add(k);R.comp()}catch(e){toast(e.message==='gzip'?'Arquivo compactado: exporte em JSON no Companion.':'Não reconheci o arquivo. Exporte a página em JSON (Settings › Default Export Format).')}};f.click()};
  $$('[data-tp]').forEach(i=>i.onchange=()=>{i.checked?compSel.add(+i.dataset.tp):compSel.delete(+i.dataset.tp);R.comp()});
  [['cpTplIn','tplIn'],['cpCols','cols'],['cpRow','startRow'],['cpCol','startCol']].forEach(([id,k])=>{const e=$('#'+id);if(e)e.onchange=()=>{c[k]=+e.value;save()}});
  $('#cpGen')&&($('#cpGen').onclick=()=>{
    const json=JSON.parse(JSON.stringify(compTpl.json));const f=findControls(json);const all=listControls(compTpl.json);const tpls=[...compSel].sort().map(i=>all[i]);
    tpls.forEach(t=>{if(f.holder.controls[t.r])delete f.holder.controls[t.r][t.c]});
    const paint=$('#cpColor').checked;let row=c.startRow;
    tpls.forEach(t=>{src.forEach((s,i)=>{const r=row+Math.floor(i/c.cols),col=c.startCol+(i%c.cols);const ctl=JSON.parse(JSON.stringify(t.ctl));retarget(ctl,c.tplIn,s.n);
      if(ctl.style){ctl.style.text=s.name;if(paint&&typeof ctl.style.bgcolor==='number')ctl.style.bgcolor=hexToInt(CAT_COLOR[s.src.cat]||'#333333')}
      (f.holder.controls[r]=f.holder.controls[r]||{})[col]=ctl});row+=Math.ceil(src.length/c.cols)});
    if(f.holder.name!=null&&typeof f.holder.name==='string')f.holder.name=(sw.name+' · '+p.name).slice(0,40);
    download(`companion-${slug(sw.name)}.companionconfig`,JSON.stringify(json,null,2),'application/json');toast('Página gerada. Importe no Companion em Import / Export.')});
  $('#cpCsv').onclick=()=>download(`companion-plano-${slug(p.name)}.csv`,csv([['Linha','Coluna','Texto','Entrada switcher','Categoria'],...src.map((s,i)=>[c.startRow+Math.floor(i/c.cols),c.startCol+i%c.cols,s.name,s.n,s.src.cat])]),'text/csv');
};

/* ---------- ATEM XML ---------- */
function atemShort(n){const m=String(n).toUpperCase().match(/^([A-Z]+)\s*0*(\d+)/);if(m)return (m[1].slice(0,4-m[2].length)+m[2]).slice(0,4);return String(n).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4)}
function atemParse(xml){const d=new DOMParser().parseFromString(xml,'application/xml');if(d.querySelector('parsererror'))throw new Error('xml');return {doc:d,product:d.documentElement.getAttribute('product')||'',inputs:[...d.querySelectorAll('Input[id]')].filter(x=>/^\d+$/.test(x.getAttribute('id'))&&x.hasAttribute('longName')).map(x=>({id:+x.getAttribute('id'),short:x.getAttribute('shortName')||'',long:x.getAttribute('longName')||''}))}}
R.atem=()=>{
  const p=cur(),a=p.atem,sws=switchers(p);if(!a.gear&&sws[0])a.gear=sws[0].id;const sw=gearById(a.gear);
  let parsed=null;if(a.xml){try{parsed=atemParse(a.xml)}catch(e){parsed=null}}
  const rows=parsed?parsed.inputs:(sw?sw.ins.filter(x=>x.type!=='REF').map((x,i)=>({id:i+1,short:'',long:''})):[]);
  const nm=id=>a.names[id]||{};
  $('#view').innerHTML=`<div class="vhead"><div><h1>ATEM · nomes das entradas</h1><p>Importe o XML salvo pelo ATEM Software Control, preencha os nomes a partir do patch e baixe um XML derivado com os nomes novos. O resto da configuração do arquivo é mantido.</p></div>
  <div class="acts"><button class="btn" id="atImp">${a.xml?'Trocar XML':'Importar XML da ATEM'}</button><button class="btn" id="atCsv">Nomes CSV</button><button class="btn go" id="atExp" ${a.xml?'':'disabled'}>Baixar XML derivado</button></div></div>
  <div class="grid side"><div class="panel" style="padding:6px">${rows.length?`<table class="t"><thead><tr><th>Entrada</th><th>Fonte no patch</th><th>Nome curto (4)</th><th>Nome longo (20)</th>${parsed?'<th>No XML original</th>':''}</tr></thead><tbody>
   ${rows.map(r=>{const s=sw&&sourcesInto(p,sw)[r.id-1];const n=nm(r.id);return `<tr data-id="${r.id}"><td class="num">${r.id}</td><td style="color:var(--soft)">${esc(s?.name||'—')}</td><td><input class="in num" maxlength="4" data-k="short" value="${esc(n.short??r.short)}" style="width:80px"></td><td><input class="in" maxlength="20" data-k="long" value="${esc(n.long??r.long)}"></td>${parsed?`<td style="color:var(--mute);font-size:12px">${esc(r.short)} · ${esc(r.long)}</td>`:''}</tr>`}).join('')}</tbody></table>`:'<div class="empty"><b>Sem entradas</b>Adicione uma ATEM ao projeto ou importe o XML dela.</div>'}</div>
   <div class="grid"><div class="panel"><h3>Origem dos nomes</h3>
    <label class="f" style="margin-top:10px"><span>ATEM do projeto</span><select class="in" id="atSw"><option value="">—</option>${sws.map(g=>`<option value="${g.id}" ${g.id===a.gear?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>
    <button class="btn" id="atFill">Preencher pelo patch</button>
    <p class="note">Nome longo = nome operacional da fonte; nome curto = abreviação de 4 caracteres (CAM 01 → CAM1). Ajuste à mão o que quiser.</p></div>
    <div class="panel"><h3>Arquivo</h3>${parsed?`<p style="margin:8px 0 0">Modelo no XML: <b>${esc(parsed.product||'não informado')}</b><br><span style="color:var(--soft)">${parsed.inputs.length} entradas com nome</span></p>`:a.xml?'<p class="note warn">O XML salvo não pôde ser lido. Importe de novo.</p>':'<p class="note" style="margin-top:6px">Nenhum XML importado. Dá para preparar os nomes e exportar o CSV mesmo assim.</p>'}
    <p class="note warn">Antes de restaurar na ATEM: confira modelo e firmware, guarde o XML original e teste fora do ar.</p></div></div></div>`;
  $$('tr[data-id] [data-k]').forEach(i=>i.onchange=()=>{const id=i.closest('tr').dataset.id;a.names[id]=a.names[id]||{};a.names[id][i.dataset.k]=i.value;save()});
  $('#atSw').onchange=e=>{a.gear=e.target.value;save();R.atem()};
  $('#atFill').onclick=()=>{if(!sw){toast('Escolha a ATEM do projeto.');return}sourcesInto(p,sw).forEach(s=>{if(s.src)a.names[s.n]={short:atemShort(s.name),long:s.name.slice(0,20)}});save();R.atem();toast('Nomes preenchidos pelo patch')};
  $('#atImp').onclick=()=>{const f=$('#fileIn');f.accept='.xml,application/xml,text/xml';f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return;file.text().then(t=>{try{const r=atemParse(t);a.xml=t;a.product=r.product;save();R.atem();toast(`${r.inputs.length} entradas lidas`)}catch(e){toast('Não consegui ler esse XML. Use o arquivo salvo pelo ATEM Software Control.')}})};f.click()};
  $('#atExp').onclick=()=>{try{const r=atemParse(a.xml);r.doc.querySelectorAll('Input[id]').forEach(n=>{const v=a.names[n.getAttribute('id')];if(v&&n.hasAttribute('longName')){if(v.short!=null)n.setAttribute('shortName',v.short.slice(0,4));if(v.long!=null)n.setAttribute('longName',v.long.slice(0,20))}});download(`ATEM-${slug(p.name)}-nomes-TESTAR.xml`,'<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(r.doc).replace(/^<\?xml[^>]*\?>\s*/,''),'application/xml')}catch(e){toast('Falha ao gerar o XML.')}};
  $('#atCsv').onclick=()=>download(`atem-nomes-${slug(p.name)}.csv`,csv([['Entrada','Nome curto','Nome longo'],...rows.map(r=>{const n=nm(r.id);return [r.id,n.short??r.short,n.long??r.long]})]),'text/csv');
};

/* ---------- Videohub ---------- */

  <div class="panel" style="padding:6px"><div class="row" style="padding:8px 10px;justify-content:space-between"><b style="font-size:13px">Saídas e roteamento</b><span class="row"><button class="btn sm" id="vh11">1:1</button><button class="btn sm ghost" id="vhClr">Limpar</button></span></div><table class="t"><thead><tr><th>Saída</th><th>Destino (do patch)</th><th>Recebe a entrada</th></tr></thead><tbody>${outs.map(x=>`<tr><td class="num">${x.n}</td><td style="${x.name?'':'color:var(--mute)'}">${esc(label(x,x.port.name))}</td><td><select class="in" data-o="${x.n}" style="padding:4px 6px"><option value="">—</option>${ins.map(i=>`<option value="${i.n}" ${+st.routes[x.n]===i.n?'selected':''}>${i.n} · ${esc(label(i,i.port.name))}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>

function dayPatternOf(p){const ds=p.days||[];if(!ds.length)return [];const t0=parseYMD(ds[0].date);return ds.map(d=>[Math.round((parseYMD(d.date)-t0)/864e5),d.type,d.onair||'',d.label||''])}
function daysFromPattern(pat,start){const t0=parseYMD(start);return pat.map(([off,type,onair,label])=>{const d=new Date(t0);d.setDate(t0.getDate()+off);return {id:uid(),date:ymd(d),type,onair:onair||'',label:label||''}})}
function modelInfo(m){if(m.wz){const o={...WZ_BASE,...m.wz};return `${o.ncam+o.nptz} câmeras · ${m.days.length} dia(s) · ${m.rd.length} blocos`}const d=m.data;return `${d.gear.length} equip. · ${(d.racks||[]).length?d.racks.length+' rack(s) · ':''}${(m.pattern||[]).length||'—'} dia(s) · ${d.rundown.length} blocos`}
function createFromModel(m,v){
  let p;
  if(m.wz){p=newProject(v.name);normalize(p);generatePatch(p,{...WZ_BASE,...m.wz});suggestAll(p);
    p.days=v.start?daysFromPattern(m.days,v.start):[];const sd=p.days.filter(d=>d.type==='Evento'||d.type==='Ensaio');
    (sd.length?sd:[null]).forEach(d=>m.rd.forEach(([title,type,dur,cam])=>p.rundown.push({id:uid(),title,type,dur,cam,notes:'',day:d?d.id:null})));
    p.crew=m.crew.map(([role,ic])=>({id:uid(),name:'',role,ic,radio:'',phone:''}));
  }else{
    p=JSON.parse(JSON.stringify(m.data));p.id=uid();p.name=v.name;p.created=new Date().toISOString();p.snaps=[];p.sep={};(p.check||[]).forEach(c=>c.done=false);
    p.days=v.start&&m.pattern?daysFromPattern(m.pattern,v.start):[];
    p.rundown.forEach(b=>{b.id=uid();b.day=b.dayIdx!=null&&p.days[b.dayIdx]?p.days[b.dayIdx].id:null;delete b.dayIdx});
  }
  p.client=v.client||'';p.venue=v.venue||'';p.date='';
  normalize(p);syncDate(p);S.projects.push(p);S.current=p.id;if(S.dropDemo){S.projects=S.projects.filter(x=>x.id!==S.dropDemo);delete S.dropDemo}save();return p;
}
function saveAsModel(p,name,desc,parts){
  const d=strip(p),blank=newProject('x');
  if(!parts.patch){['gear','links','mv'].forEach(k=>d[k]=blank[k]);d.racks=[];d.vh={};d.extras=[];d.camsheets={};d.cases=[]}
  if(!parts.rundown)d.rundown=[];else d.rundown=d.rundown.map(b=>({...b,dayIdx:Math.max(0,(p.days||[]).findIndex(x=>x.id===b.day)),day:null}));
  if(!parts.crew)d.crew=[];
  if(!parts.check)d.check=blank.check;
  if(!parts.audio)delete d.audio;
  if(!parts.space){d.floor=blank.floor;d.house=blank.house;d.cables=blank.cables}
  if(!parts.notes)d.notes='';
  d.sep={};
  const m={id:uid(),name,desc:desc||'',created:new Date().toISOString(),pattern:dayPatternOf(p),data:d};S.templates.push(m);save();return m;
}

function inv(){S.inv=S.inv||{gear:{},cab:{}};S.inv.gear=S.inv.gear||{};S.inv.cab=S.inv.cab||{};return S.inv}
function needGear(p){const n={};p.gear.forEach(g=>{n[g.model]=(n[g.model]||0)+1});return n}
function needCab(p){const sp=1+(p.orderSpare??10)/100;const raw={};p.links.forEach(l=>{if(l.type==='RF')return;const m=parseFloat(String(l.len).replace(',','.'));const k=l.type+'|'+(m>0?roundLen(l.type,m):'?');raw[k]=(raw[k]||0)+1});const out={};Object.entries(raw).forEach(([k,n])=>out[k]=Math.ceil(n*sp));return out}
const invHas=()=>{const I=inv();return Object.values(I.gear).some(v=>v>0)||Object.values(I.cab).some(v=>v>0)};
function stockCell(need,have,show){if(!show)return '<span style="color:var(--mute)">—</span>';const f=need-have;return f>0?`<b style="color:var(--tally)">falta ${f}</b> <span style="color:var(--mute)">(tem ${have})</span>`:`<span style="color:var(--phos)">ok</span> <span style="color:var(--mute)">(tem ${have})</span>`}

  const falta=models.filter(m=>(ng[m]||0)>(I.gear[m]||0)).length+Object.entries(nc).filter(([k,n])=>!k.endsWith('|?')&&n>(I.cab[k]||0)).length;

let addrPick;
const mapsURL=(p,dir)=>{const q=p.geo?`${p.geo.lat},${p.geo.lon}`:(p.address||p.venue||'');if(!q)return '';return dir?`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`};

const STD_LEN={SDI:[0.5,1,2,3,5,10,15,20,25,30,40,50,75,100],Fibra:[25,50,100,150,200,300,500],HDMI:[0.5,1,2,3,5,10,15],Rede:[0.5,1,2,3,5,10,15,20,30,50,75,100],'Áudio':[1,2,3,5,10,15,20,30,50,100],REF:[1,2,3,5,10,15,20,30,50,100]};
const FIELD_CATS=['Câmeras','Sony Cinema Line / FX','PTZ Panasonic / Sony'];
function roundLen(type,m){const l=STD_LEN[type]||STD_LEN.SDI;return l.find(x=>x>=m-1e-6)||l[l.length-1]}
function camRun(p,g,type){
  const it=p.floor.items.find(i=>i.kind==='cam'&&(i.gearId===g.id||i.name===g.name));const sc=p.floor.scale;
  if(it&&sc&&p.cables.routes.length){let best=null;p.cables.routes.forEach(r=>{if(!r.pts||r.pts.length<2)return;const ends=[r.pts[0],r.pts[r.pts.length-1]];const d=Math.min(...ends.map(e=>Math.hypot(e[0]-it.x,e[1]-it.y)));if(d*sc<=8){const m=r.len?+r.len:routeLen(r,sc).m;if(m&&(!best||(r.type&&type&&r.type.startsWith(type))))best=m}});if(best)return {m:best*1.1+3,src:'rota'}}
  if(it&&sc){const stage=p.floor.items.find(i=>i.kind==='stage');const others=p.floor.items.filter(i=>i.kind==='cam'&&i!==it);
    const ref=p.floor.items.find(i=>/régie|regie|controle|switcher|unidade|ob van|caminh/i.test(i.name||''));
    if(ref){return {m:Math.hypot(ref.x-it.x,ref.y-it.y)*sc*1.4+5,src:'planta'}}}
  return null;
}
function suggestLen(p,l){
  const A=gearById(l.a),B=gearById(l.b);if(!A||!B||l.type==='RF')return null;const t=l.type;
  if(A.rack&&A.rack===B.rack)return {m:roundLen(t,t==='Fibra'?1:1),src:'mesmo rack'};
  const field=[A,B].find(g=>FIELD_CATS.includes(g.cat));
  if(field){const r=camRun(p,field,t);const def={SDI:50,Fibra:100,HDMI:10,Rede:50,'Áudio':30,REF:50}[t]||50;let m=r?r.m:def;
    if(t==='HDMI')m=Math.min(m,15);if(t==='SDI')m=Math.min(m,100);return {m:roundLen(t,m),src:r?r.src:'padrão de câmera'}}
  const mon=[A,B].some(g=>g.cat==='Monitoração'||g.cat==='LED / Processamento');
  if(mon)return {m:roundLen(t,t==='Rede'?10:t==='HDMI'?5:10),src:'monitoração'};
  if(t==='Rede')return {m:roundLen(t,A.rack||B.rack?5:10),src:'rede da régie'};
  if(t==='Áudio')return {m:roundLen(t,10),src:'régie'};
  return {m:roundLen(t,A.rack||B.rack?3:5),src:'régie'};
}
function suggestAll(p,all){let n=0;p.links.forEach(l=>{const has=parseFloat(String(l.len).replace(',','.'))>0;if(has&&!l.sug&&!all)return;if(has&&!l.sug)return;const s=suggestLen(p,l);if(s){l.len=String(s.m);l.sug=s.src;n++}});return n}
