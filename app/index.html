function camInfo(p,g){
  p.camsheets=p.camsheets||{};const cs=p.camsheets[g.id]=p.camsheets[g.id]||{op:'',lens:'',pos:'',notes:''};
  const sw=p.gear.find(x=>x.cat==='ATEM / Switchers');let atemIn=null;
  if(sw){const l=p.links.find(l=>l.a===g.id&&l.b===sw.id);if(l)atemIn=sw.ins.findIndex(x=>x.id===l.bp)+1}
  const outs=p.links.filter(l=>l.a===g.id).map(l=>{const b=gearById(l.b);return `${g.outs.find(x=>x.id===l.ap)?.name} → ${b?.name} ${b?.ins.find(x=>x.id===l.bp)?.name}${l.label?' ('+l.label+')':''}`});
  const ret=p.links.filter(l=>l.b===g.id).map(l=>{const a=gearById(l.a);return `${a?.name} ${a?.outs.find(x=>x.id===l.ap)?.name} → ${g.ins.find(x=>x.id===l.bp)?.name}`});
  const crew=p.crew.find(c=>c.name===cs.op);const fl=p.floor.items.find(i=>i.gearId===g.id||i.name===g.name);
  const blocks=p.rundown.map((b,i)=>({b,i})).filter(({b})=>String(b.cam).trim().toLowerCase()===g.name.toLowerCase());
  const atemName=atemIn&&p.atem.names[atemIn]?p.atem.names[atemIn]:null;
  return {cs,atemIn,outs,ret,crew,fl,blocks,atemName};
}
function camSheetHTML(p,g){
  const x=camInfo(p,g);const T=rdTimes(p);
  return `<section class="pb camsheet"><div class="cs-head"><div><span>Folha de câmera</span><h1>${esc(g.name)}</h1><b>${esc(g.model)}</b></div><div class="cs-in"><span>Entrada no switcher</span><b>${x.atemIn||'—'}</b>${x.atemName?`<small>${esc(x.atemName.short||'')} · ${esc(x.atemName.long||'')}</small>`:''}</div></div>
  <div class="two"><div>
   <h3>Operação</h3><table><tbody>
    <tr><th>Operador</th><td><b>${esc(x.cs.op||'—')}</b></td></tr>
    <tr><th>Intercom</th><td>${esc(x.crew?.ic||'—')}</td></tr><tr><th>Rádio</th><td>${esc(x.crew?.radio||'—')}</td></tr>
    <tr><th>Lente</th><td>${esc(x.cs.lens||'—')}</td></tr>
    <tr><th>Posição</th><td>${esc(x.cs.pos||'—')}</td></tr>
    ${x.fl?`<tr><th>Focal / abertura</th><td>${x.fl.focal} mm · ${fmt(fovOf(x.fl),1)}°</td></tr>`:''}
   </tbody></table>
   <h3>Sinais</h3><table><tbody>${x.outs.map(o=>`<tr><th>Saída</th><td>${esc(o)}</td></tr>`).join('')||'<tr><td class="muted">Sem saídas ligadas.</td></tr>'}${x.ret.map(o=>`<tr><th>Entrada</th><td>${esc(o)}</td></tr>`).join('')}</tbody></table>
  </div><div>${x.fl?`<div class="fig">${floorSVG(p,{print:true,hl:x.fl.id})}</div><p class="cap">Posição na planta (destacada).</p>`:'<p class="note">Câmera ainda não posicionada na planta.</p>'}</div></div>
  <h3>Blocos em que abre o programa</h3>${x.blocks.length?`<table><thead><tr><th>#</th><th>Entrada</th><th>Bloco</th><th>Tipo</th><th>Duração</th><th>Observações</th></tr></thead><tbody>${x.blocks.map(({b,i})=>`<tr><td class="num">${T[b.id]?String(T[b.id].i+1).padStart(2,'0'):''}</td><td class="num">${T[b.id]&&T[b.id].day&&showDays(p).length>1?esc(dayName(T[b.id].day))+' ':''}${T[b.id]&&T[b.id].t?T[b.id].t.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):mmss(T[b.id]?T[b.id].s:0)}</td><td><b>${esc(b.title)}</b></td><td>${esc(b.type)}</td><td class="num">${mmss(b.dur)}</td><td>${esc(b.notes)}</td></tr>`).join('')}</tbody></table>`:'<p class="note">Nenhum bloco do espelho abre nesta câmera.</p>'}
  <h3>Orientações</h3><div style="white-space:pre-wrap;min-height:20mm;border:.5pt solid #ccc;padding:6pt">${esc(x.cs.notes||'')}</div></section>`;
}
const CS_CSS=`.doc .camsheet .cs-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2pt solid #111;padding-bottom:6pt;margin-bottom:10pt}
.doc .camsheet .cs-head span{font-size:8pt;color:#0a8f45;font-weight:700}
.doc .camsheet h1{font:900 38pt/.9 Archivo,Arial Narrow,sans-serif;font-stretch:65%;margin:2pt 0;text-transform:uppercase}
.doc .camsheet .cs-in{text-align:right;border:2pt solid #111;padding:5pt 10pt}
.doc .camsheet .cs-in b{display:block;font:800 30pt/1 'JetBrains Mono',monospace}
.doc .camsheet .cs-in small{font-size:8pt;color:#555}
.doc .camsheet th{width:30%;background:none;border-bottom:.5pt solid #d5d9d6;color:#555;font-weight:600}
.doc .camsheet section.pb:first-child{break-before:auto}
.doc-preview .camsheet.pb{border:0;margin:0;padding:0}`;
let csSel=null;
R.camsheets=()=>{
  const p=cur();const cams=camGear(p);if(!csSel||!gearById(csSel))csSel=cams[0]?.id||null;const g=csSel&&gearById(csSel);
  $('#view').innerHTML=`<style>${DOC_CSS}${CS_CSS}</style><div class="vhead"><div><h1>Folhas de câmera</h1><p>Uma página por câmera para entregar ao operador: entrada no switcher, ligações, intercom, lente, posição na planta e os blocos do espelho em que ela abre.</p></div>
  <div class="acts"><button class="btn" id="csOne" ${g?'':'disabled'}>${DESK?'PDF desta':'Imprimir esta'}</button><button class="btn go" id="csAll" ${cams.length?'':'disabled'}>${DESK?'PDF de todas':'Imprimir todas'} (${cams.length})</button></div></div>
  ${cams.length?`<div class="grid side-l" style="grid-template-columns:300px 1fr"><div class="panel">
   <div class="seg" style="flex-wrap:wrap;display:flex;margin-bottom:14px">${cams.map(c=>`<button data-c="${c.id}" class="${c.id===csSel?'on':''}">${esc(c.name)}</button>`).join('')}</div>
   ${(()=>{const x=camInfo(p,g);return `<label class="f"><span>Operador</span><select class="in" data-cs="op"><option value="">—</option>${p.crew.map(c=>`<option ${c.name===x.cs.op?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
   <label class="f"><span>Lente</span><input class="in" data-cs="lens" value="${esc(x.cs.lens)}" placeholder="Ex.: Fujinon XA20sx8.5"></label>
   <label class="f"><span>Posição</span><input class="in" data-cs="pos" value="${esc(x.cs.pos)}" placeholder="Ex.: praticável central, 3 m"></label>
   <label class="f"><span>Orientações para o operador</span><textarea class="in" data-cs="notes" rows="5">${esc(x.cs.notes)}</textarea></label>
   <p class="note">Intercom e rádio vêm da Equipe; entrada e ligações vêm do Patch; blocos vêm do Espelho (coluna Fonte com o mesmo nome da câmera).</p>`})()}
  </div><div class="doc-preview"><div class="doc">${camSheetHTML(p,g)}</div></div></div>`:'<div class="empty"><b>Nenhuma câmera no projeto</b>Adicione câmeras em Equipamentos, use um kit ou o gerador de patch.</div>'}`;
  $$('[data-c]').forEach(b=>b.onclick=()=>{csSel=b.dataset.c;R.camsheets()});
  $$('[data-cs]').forEach(i=>{const fn=()=>{camInfo(p,g).cs[i.dataset.cs]=i.value;save();$('.doc-preview .doc').innerHTML=camSheetHTML(p,g)};i.oninput=fn;i.onchange=fn});
  const pr=list=>{$('#report').innerHTML=`<style>${DOC_CSS}${CS_CSS}@media print{@page{@bottom-left{content:"${String(p.name).replace(/["\\]/g,'')} · folhas de câmera";font:7pt Arial;color:#777}}}</style><div class="doc">${list.map(c=>camSheetHTML(p,c)).join('')}</div>`;setTimeout(()=>{try{window.print()}catch(e){toast('Impressão indisponível aqui. Abra o arquivo HTML local.')}},60)};
  if(DESK){const pdf=list=>deskPDF(`<style>${DOC_CSS}${CS_CSS}</style><div class="doc">${list.map(c=>camSheetHTML(p,c)).join('')}</div>`,`${slug(p.name)}-folhas-de-camera.pdf`);$('#csOne')&&($('#csOne').onclick=()=>pdf([g]));$('#csAll')&&($('#csAll').onclick=()=>pdf(cams));return}
  $('#csOne')&&($('#csOne').onclick=()=>pr([g]));$('#csAll')&&($('#csAll').onclick=()=>pr(cams));
};

/* ---------- busca rápida ---------- */
let palItems=[],palIdx=0;
function openPal(){$('#palBg').classList.add('open');$('#palIn').value='';palFill('');$('#palIn').focus()}
function closePal(){$('#palBg').classList.remove('open')}
function palFill(q){
  q=q.toLowerCase();const p=cur();
  const all=[...VIEWS.flatMap(([g,it])=>it.map(([id,l])=>({t:l,s:g,run:()=>go(id)}))),
    ...p.gear.map(g=>({t:g.name,s:g.model,run:()=>{gearSel=g.id;go('gear')}})),
    ...S.projects.filter(x=>x!==p).map(x=>({t:'Abrir projeto: '+x.name,s:'Projeto',run:()=>{S.current=x.id;save();render()}})),
    {t:'Ligar / desligar ON AIR',s:'Ação',run:()=>$('#onair').click()},
    {t:'Editar dados do evento',s:'Ação',run:()=>{go('dash');editEvent()}},
    {t:'Baixar backup',s:'Ação',run:()=>download(`central-tecnica-v41-backup.json`,JSON.stringify(S),'application/json')}];
  palItems=all.filter(i=>(i.t+' '+i.s).toLowerCase().includes(q)).slice(0,12);palIdx=0;drawPal();
}
function drawPal(){$('#palList').innerHTML=palItems.map((i,k)=>`<li class="${k===palIdx?'act':''}" data-k="${k}">${esc(i.t)}<small>${esc(i.s)}</small></li>`).join('')||'<li style="color:var(--mute)">Nada encontrado</li>';$$('#palList li[data-k]').forEach(li=>li.onclick=()=>{closePal();palItems[+li.dataset.k].run()})}
$('#palIn').oninput=e=>palFill(e.target.value);
$('#palIn').onkeydown=e=>{if(e.key==='ArrowDown'){palIdx=Math.min(palIdx+1,palItems.length-1);drawPal();e.preventDefault()}if(e.key==='ArrowUp'){palIdx=Math.max(palIdx-1,0);drawPal();e.preventDefault()}if(e.key==='Enter'&&palItems[palIdx]){closePal();palItems[palIdx].run()}if(e.key==='Escape')closePal()};
$('#palBg').onclick=e=>{if(e.target.id==='palBg')closePal()};
$('#palBtn').onclick=openPal;
$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')$('#modalBg').classList.remove('open')};
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}
  if(e.key==='Escape'){if(pPick){pPick=null;R.patch()}if(fCal){fCal=null;R.floor()}if(cDraw){cDraw=null;R.cable()}}
  if((e.key==='Delete'||e.key==='Backspace')&&view==='patch'&&pSel&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){const p=cur();p.links=p.links.filter(l=>l.id!==pSel);pSel=null;save();renderRail();R.patch()}
});
window.addEventListener('resize',()=>{if(view==='patch')applyPV()});

function deskPDF(body,name){const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css"><style>body{margin:0;background:#fff}</style></head><body>${body}</body></html>`;toast('Gerando PDF…');DESK.savePDF(html,name).then(f=>{if(f)toast('PDF salvo e aberto')}).catch(()=>toast('Não foi possível gerar o PDF.'))}
if(DESK){DESK.onMenu(cmd=>{if(cmd==='flush'){clearTimeout(saveT);try{DESK.saveState(JSON.stringify(S))}catch(e){}return}if(cmd.startsWith('go:'))return go(cmd.slice(3));
  if(cmd==='palette')return openPal();if(cmd==='onair')return $('#onair').click();if(cmd==='newproj')return $('#newProj').click();
  if(cmd==='backup-save')return download(`central-tecnica-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S),'application/json');
  if(cmd==='backup-open'){go('backup');setTimeout(()=>$('#bImp')&&$('#bImp').click(),50)}});}
render();requestAnimationFrame(tick);
</script>
